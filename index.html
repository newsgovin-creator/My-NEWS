<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>इंडियन न्यूज़</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#1c1917;--mute:#78716c;--line:#e7e0d4;--accent:#c2410c;--accent2:#9a3412;--fs:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#141210;--card:#1e1b18;--ink:#f5efe6;--mute:#a8a095;--line:#34302b;--accent:#fb923c;--accent2:#fdba74}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:var(--sat)}
.top{background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-weight:800;font-size:23px;letter-spacing:-.3px;color:var(--accent)}
.logo small{display:block;font-size:10.5px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:-4px}
.ibtns{display:flex;gap:4px}
.ib{background:none;border:0;width:44px;height:44px;border-radius:50%;font-size:19px}
.ib:active{background:var(--line)}
.ticker{background:var(--accent);color:#fff;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;padding:5px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tk 40s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
.cats{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.cats::-webkit-scrollbar{display:none}
.cat{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;font-size:15px;color:var(--mute);white-space:nowrap;min-height:44px}
.cat[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.ptr{height:0;overflow:hidden;text-align:center;font-size:13px;color:var(--mute);transition:height .2s}
.card{background:var(--card);padding:14px;border-bottom:1px solid var(--line);margin-bottom:6px;content-visibility:auto;contain-intrinsic-size:120px}
.card h3{margin:0;font-size:calc(var(--fs) + 1px);line-height:1.45;font-weight:800;cursor:pointer}
.card.hero h3{font-size:calc(var(--fs) + 4px);margin-bottom:10px}
.kick{color:var(--accent)}
.row{display:flex;gap:12px;align-items:flex-start}
.row>div:first-child{flex:1}
.img{background:linear-gradient(135deg,var(--line),var(--bg));border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:26px}
.img img{width:100%;height:100%;object-fit:cover}
.thumb{width:112px;height:80px}
.big{width:100%;aspect-ratio:16/9}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px}
.pill{border:1px solid var(--line);background:none;border-radius:16px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--mute);min-height:30px}
.acts{display:flex;gap:2px}
.act{background:none;border:0;min-width:44px;min-height:44px;font-size:16px;border-radius:50%}
.act:active{background:var(--line)}
.act.on{color:var(--accent)}
.src{font-size:11.5px;color:var(--mute);margin-top:6px}
.sk{padding:14px;background:var(--card);margin-bottom:6px;display:flex;gap:12px}
.sh{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:50px 24px;color:var(--mute)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:800;margin-top:14px;min-height:44px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab);flex-shrink:0}
.nt{flex:1;background:none;border:0;padding:7px 0 6px;font-size:11.5px;font-weight:700;color:var(--mute);min-height:50px}
.nt i{display:block;font-style:normal;font-size:20px}
.nt[aria-selected=true]{color:var(--accent)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-head{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line);padding-top:calc(6px + var(--sat))}
.sh-head .sp{flex:1}
.prog{height:3px;background:var(--accent);width:0;flex-shrink:0}
.body{flex:1;overflow-y:auto;padding:16px;background:var(--card)}
.body h1{font-size:calc(var(--fs) + 5px);line-height:1.4;margin:8px 0}
.body p{font-size:var(--fs);line-height:1.85;white-space:pre-line}
.meta{font-size:12.5px;color:var(--mute)}
.search{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:22px;padding:10px 16px;font:inherit;font-size:15px;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.set{padding:14px;background:var(--card);margin-bottom:6px}
.set h4{margin:0 0 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 14px;font-weight:700;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:absolute;left:50%;bottom:calc(70px + var(--sab));transform:translateX(-50%);background:#292524;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.off{background:#b45309;color:#fff;text-align:center;font-size:12.5px;padding:4px;display:none}
.form input,.form textarea,.form select{width:100%;margin-bottom:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="app">
  <div class="top">
    <div class="bar">
      <div class="logo">इंडियन न्यूज़<small>आपके ज़िले की हर खबर</small></div>
      <div class="ibtns">
        <button class="ib" data-a="search" aria-label="खोजें">🔍</button>
        <button class="ib" data-a="theme" aria-label="डार्क मोड बदलें">🌓</button>
      </div>
    </div>
    <div class="ticker" id="ticker" hidden><span id="tickTxt"></span></div>
    <div class="cats" id="cats" role="tablist"></div>
  </div>
  <div class="off" id="off">इंटरनेट नहीं है — पुरानी सेव की हुई खबरें दिख रही हैं</div>
  <div class="feed" id="feed"><div class="ptr" id="ptr">↓ रिफ्रेश के लिए खींचें</div><div id="list"></div></div>
  <nav class="nav" role="tablist">
    <button class="nt" role="tab" aria-selected="true" data-tab="home"><i>🏠</i>होम</button>
    <button class="nt" role="tab" aria-selected="false" data-tab="video"><i>▶️</i>वीडियो</button>
    <button class="nt" role="tab" aria-selected="false" data-tab="saved"><i>🔖</i>सेव</button>
    <button class="nt" role="tab" aria-selected="false" data-tab="settings"><i>⚙️</i>सेटिंग</button>
  </nav>

  <div class="sheet" id="reader"><div class="sh-head"><button class="ib" data-a="close" aria-label="वापस">←</button><span class="sp"></span><button class="ib" data-a="speak" id="rSpeak" aria-label="सुनें">🔊</button><button class="ib" data-a="rbm" id="rBm" aria-label="सेव करें">🔖</button><button class="ib" data-a="rshare" aria-label="शेयर">📤</button></div><div class="prog" id="prog"></div><div class="body" id="rBody"></div></div>

  <div class="sheet" id="searchS"><div class="sh-head"><button class="ib" data-a="close" aria-label="वापस">←</button><input class="search" id="q" type="search" placeholder="खबर खोजें…" enterkeyhint="search"></div><div class="feed" id="sRes"><div class="chips" id="recent"></div></div></div>

  <div class="sheet" id="admin"><div class="sh-head"><button class="ib" data-a="close" aria-label="बंद करें">✕</button><b>एडमिन पैनल</b></div><div class="body form">
    <p class="meta">नोट: यहाँ की खबरें सिर्फ इसी फोन में रहती हैं। सबको दिखाने के लिए Blogger पर पोस्ट करें (नीचे कोड कॉपी करें)।</p>
    <input id="aBlog" placeholder="Blogger URL (वैकल्पिक)">
    <input id="aTitle" placeholder="हेडलाइन (: या | से शुरुआती रंगीन लाइन अलग करें)">
    <input id="aLoc" placeholder="ज़िला / इलाका" value="कानपुर देहात">
    <input id="aImg" placeholder="फोटो लिंक (https://…)">
    <textarea id="aFull" rows="5" placeholder="पूरी खबर…"></textarea>
    <button class="btn" data-a="pub" style="width:100%">🚀 पब्लिश करें</button>
    <button class="btn" data-a="cpy" style="width:100%;background:#2563eb">📋 Blogger कोड कॉपी करें</button>
    <button class="btn" data-a="saveblog" style="width:100%;background:#16a34a">💾 Blogger URL सेव करें</button>
  </div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const S={
  get(k,d){try{const v=localStorage.getItem('inp_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('inp_'+k,JSON.stringify(v))}catch(e){}}
};
// Text ko safe banata hai (XSS se bachav)
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'n'+(h>>>0).toString(36)};

const CATS=[
 {n:'टॉप न्यूज़',q:'उत्तर प्रदेश भारत बड़ी खबरें'},{n:'कानपुर देहात',q:'कानपुर देहात समाचार'},
 {n:'उत्तरप्रदेश',q:'उत्तर प्रदेश समाचार'},{n:'देश',q:'भारत देश समाचार'},
 {n:'क्रिकेट',q:'क्रिकेट समाचार'},{n:'मनोरंजन',q:'मनोरंजन बॉलीवुड समाचार'},
 {n:'बिजनेस',q:'बिजनेस समाचार भारत'},{n:'रोजगार',q:'रोजगार सरकारी नौकरी समाचार'}
];
const st={tab:'home',cat:0,items:[],byId:{},bm:S.get('bm',{}),local:S.get('local',[]),
  cfg:S.get('cfg',{blog:'',pin:''}),prefs:S.get('prefs',{fs:16,theme:'auto'}),recent:S.get('recent',[]),
  cur:null,speakId:null,reqId:0};

// ---------- Theme / font ----------
function applyPrefs(){
  const dark=st.prefs.theme==='dark'||(st.prefs.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.setProperty('--fs',st.prefs.fs+'px');
  document.querySelector('meta[name=theme-color]').content=dark?'#1e1b18':'#fffdf9';
}
applyPrefs();

// ---------- Fetch ----------
function parseTitle(t){
  let kick='',head=t;
  if(t.includes('|')){const p=t.split('|').map(x=>x.trim());kick=p[0];head=p.slice(1).join(' ')}
  else if(t.includes(':')){const i=t.indexOf(':');kick=t.slice(0,i+1);head=t.slice(i+1).trim()}
  return {kick,head};
}
function mk(o){o.id=o.id||hash(o.link||o.head+o.date);st.byId[o.id]=o;return o}

async function fetchLive(q){
  const rss=encodeURIComponent('https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=hi&gl=IN&ceid=IN:hi');
  const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+rss);
  if(!r.ok)throw new Error('http');
  const d=await r.json();
  return (d.items||[]).map(it=>{
    const parts=it.title.split(' - ');const src=parts.length>1?parts.pop():'समाचार';
    const {kick,head}=parseTitle(parts.join(' - '));
    const tmp=document.createElement('div');tmp.innerHTML=it.description||'';
    const img=it.thumbnail||it.enclosure&&it.enclosure.link||'';
    return mk({kick,head,src,loc:src,img:safeUrl(img),link:safeUrl(it.link),date:it.pubDate,
      full:(tmp.textContent||'').trim()});
  });
}
function fetchBlog(url){
  return new Promise(res=>{
    let u=url.replace(/\/$/,'');if(!/^https?:/.test(u))u='https://'+u;
    const cb='bcb'+Date.now();
    const sc=document.createElement('script');
    const done=v=>{delete window[cb];sc.remove();res(v)};
    window[cb]=j=>{
      const out=((j.feed&&j.feed.entry)||[]).map(e=>{
        const t=e.title?e.title.$t:'';const tmp=document.createElement('div');tmp.innerHTML=e.content?e.content.$t:'';
        const im=tmp.querySelector('img');const {kick,head}=parseTitle(t);
        return mk({kick,head,src:'हमारी खबर',loc:(e.category&&e.category[0]&&e.category[0].term)||'उत्तरप्रदेश',
          img:safeUrl(im?im.src:''),link:'',date:e.published?e.published.$t:'',full:(tmp.textContent||'').trim(),own:1});
      });done(out);
    };
    sc.src=u+'/feeds/posts/default?alt=json-in-script&max-results=15&callback='+cb;
    sc.onerror=()=>done([]);document.body.appendChild(sc);
    setTimeout(()=>done([]),8000);
  });
}

async function load(q,force){
  const my=++st.reqId;
  const key='cache_'+hash(q);
  const cached=S.get(key,null);
  if(cached&&!force){show(cached.items)}else showSkel();
  let items=[],failed=false;
  try{
    const [own,live]=await Promise.all([st.cfg.blog?fetchBlog(st.cfg.blog):[],fetchLive(q)]);
    items=[...st.local.map(mk),...own,...live];
    $('#off').style.display='none';
    S.set(key,{t:Date.now(),items:items.slice(0,40)});
  }catch(e){failed=true;}
  if(my!==st.reqId)return;
  if(failed){
    $('#off').style.display=navigator.onLine?'none':'block';
    if(cached){cached.items.forEach(i=>st.byId[i.id]=i);show(cached.items);toast('ताज़ा खबरें नहीं मिलीं, सेव की हुई दिखा रहे हैं');return}
    $('#list').innerHTML='<div class="empty"><b>खबरें नहीं आ पाईं</b>इंटरनेट जाँचें और फिर कोशिश करें।<br><button class="btn" data-a="retry">फिर कोशिश करें</button></div>';return;
  }
  show(items);
}

// ---------- Render ----------
function showSkel(){
  let h='';for(let i=0;i<5;i++)h+='<div class="sk"><div style="flex:1"><div class="sh" style="height:16px;margin-bottom:8px"></div><div class="sh" style="height:16px;width:70%"></div></div><div class="sh" style="width:112px;height:80px"></div></div>';
  $('#list').innerHTML=h;
}
function imgBox(it,cls){
  return '<div class="img '+cls+'">'+(it.img?'<img src="'+esc(it.img)+'" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'📰')+'</div>';
}
function card(it,hero){
  const saved=st.bm[it.id]?' on':'';
  const title='<span class="kick">'+esc(it.kick)+'</span> '+esc(it.head);
  const foot='<div class="foot"><button class="pill" data-a="loc" data-v="'+esc(it.loc)+'">'+esc(it.loc)+' ›</button><div class="acts">'
   +'<button class="act" data-a="speakc" data-id="'+it.id+'" aria-label="सुनें">🔊</button>'
   +'<button class="act'+saved+'" data-a="bm" data-id="'+it.id+'" aria-label="सेव करें">🔖</button>'
   +'<button class="act" data-a="share" data-id="'+it.id+'" aria-label="शेयर">📤</button></div></div>';
  const meta='<div class="src">'+esc(it.src)+(it.date?' • '+ago(it.date):'')+'</div>';
  if(hero)return '<article class="card hero"><h3 data-a="open" data-id="'+it.id+'" tabindex="0">'+title+'</h3>'+imgBox(it,'big')+meta+foot+'</article>';
  return '<article class="card"><div class="row"><div><h3 data-a="open" data-id="'+it.id+'" tabindex="0">'+title+'</h3>'+meta+'</div>'+imgBox(it,'thumb')+'</div>'+foot+'</article>';
}
function show(items,into){
  const box=into||$('#list');
  if(!items.length){box.innerHTML='<div class="empty"><b>कुछ नहीं मिला</b>कोई दूसरी कैटेगरी या शब्द आज़माएँ।</div>';return}
  st.items=into?st.items:items;
  box.innerHTML=items.map((it,i)=>card(it,i===0&&!into)).join('');
  if(!into){
    const tk=items.slice(0,6).map(i=>i.head).join('  ◆  ');
    $('#ticker').hidden=false;$('#tickTxt').textContent=tk;
    if(!into)$('#feed').scrollTop=0;
  }
}
function ago(d){
  const m=(Date.now()-new Date(d))/6e4;if(isNaN(m))return '';
  if(m<60)return Math.max(1,Math.round(m))+' मिनट पहले';
  if(m<1440)return Math.round(m/60)+' घंटे पहले';
  return Math.round(m/1440)+' दिन पहले';
}

// ---------- Reader ----------
function openArticle(id){
  const it=st.byId[id];if(!it)return;st.cur=it;
  const words=(it.full||'').split(/\s+/).length;
  $('#rBody').innerHTML='<span class="pill">'+esc(it.loc)+'</span><h1><span class="kick">'+esc(it.kick)+'</span> '+esc(it.head)+'</h1>'
   +'<div class="meta">'+esc(it.src)+(it.date?' • '+ago(it.date):'')+' • पढ़ने में '+Math.max(1,Math.round(words/120))+' मिनट</div>'
   +'<div style="margin:12px 0">'+imgBox(it,'big')+'</div>'
   +'<p>'+esc(it.full||it.head)+'</p>'
   +(it.link?'<a class="btn" style="display:inline-block;text-decoration:none" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">पूरी खबर '+esc(it.src)+' पर पढ़ें</a>':'');
  $('#rBm').style.color=st.bm[id]?'var(--accent)':'';
  $('#rBody').scrollTop=0;$('#prog').style.width='0';
  $('#reader').classList.add('open');history.pushState({r:1},'');
}
function closeSheet(){$$('.sheet.open').forEach(s=>s.classList.remove('open'));stopSpeak()}

// ---------- Actions ----------
function toggleBm(id){
  const it=st.byId[id];if(!it)return;
  if(st.bm[id]){delete st.bm[id];toast('सेव से हटाया')}else{st.bm[id]=it;toast('सेव हो गया');navigator.vibrate&&navigator.vibrate(15)}
  S.set('bm',st.bm);
  $$('[data-a=bm][data-id="'+id+'"]').forEach(b=>b.classList.toggle('on',!!st.bm[id]));
  if(st.cur&&st.cur.id===id)$('#rBm').style.color=st.bm[id]?'var(--accent)':'';
  if(st.tab==='saved')showSaved();
}
async function share(id){
  const it=st.byId[id];if(!it)return;
  const text=(it.kick+' '+it.head).trim(),url=it.link||location.href;
  try{if(navigator.share)await navigator.share({title:'इंडियन न्यूज़',text,url});
  else window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text+' '+url),'_blank','noopener')}catch(e){}
}
// Hindi TTS - lambi khabar ko chhote tukdon me todta hai
function chunks(t){return (t.match(/[^।.!?\n]+[।.!?\n]?/g)||[t]).reduce((a,s)=>{const l=a[a.length-1];if(l&&l.length+s.length<180)a[a.length-1]=l+s;else a.push(s);return a},[])}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();st.speakId=null;$$('[data-a=speakc]').forEach(b=>b.textContent='🔊');$('#rSpeak').textContent='🔊'}
function speak(id,btn){
  if(!('speechSynthesis' in window)){toast('इस फोन में आवाज़ उपलब्ध नहीं');return}
  if(st.speakId===id){stopSpeak();return}
  stopSpeak();const it=st.byId[id];if(!it)return;
  const parts=chunks((it.kick+' '+it.head+'। '+(it.full||'')).trim());
  st.speakId=id;btn.textContent='⏹️';
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang='hi-IN';
    if(i===parts.length-1)u.onend=()=>{if(st.speakId===id)stopSpeak()};speechSynthesis.speak(u)});
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

// ---------- Tabs ----------
function setTab(t){
  st.tab=t;$$('.nt').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  const catsOn=t==='home';$('#cats').style.display=catsOn?'flex':'none';$('#ticker').style.display=catsOn?'':'none';
  if(t==='home')load(CATS[st.cat].q);
  else if(t==='video')load('वीडियो समाचार इंडिया');
  else if(t==='saved')showSaved();
  else showSettings();
}
function showSaved(){
  const l=Object.values(st.bm);
  if(!l.length){$('#list').innerHTML='<div class="empty"><b>अभी कुछ सेव नहीं है</b>किसी खबर पर 🔖 दबाएँ, वो यहाँ मिलेगी।</div>';return}
  show(l,$('#list'));
}
function showSettings(){
  const p=st.prefs;
  $('#list').innerHTML='<div class="set"><h4>अक्षरों का आकार</h4><div class="seg">'
   +[[14,'छोटा'],[16,'सामान्य'],[19,'बड़ा'],[22,'बहुत बड़ा']].map(a=>'<button data-a="fs" data-v="'+a[0]+'" aria-pressed="'+(p.fs==a[0])+'">'+a[1]+'</button>').join('')
   +'</div></div><div class="set"><h4>थीम</h4><div class="seg">'
   +[['auto','ऑटो'],['light','दिन'],['dark','रात']].map(a=>'<button data-a="th" data-v="'+a[0]+'" aria-pressed="'+(p.theme===a[0])+'">'+a[1]+'</button>').join('')
   +'</div></div><div class="set"><h4>ऐप के बारे में</h4><p class="meta" style="margin:0">इंडियन न्यूज़ • खबरें Google News और आपके Blogger से आती हैं। हर खबर पर असली स्रोत का लिंक दिया जाता है।</p></div>'
   +'<div class="set"><button class="pill" data-a="admin">एडमिन</button></div>';
}

// ---------- Search ----------
function openSearch(){
  $('#searchS').classList.add('open');history.pushState({s:1},'');
  renderRecent();setTimeout(()=>$('#q').focus(),260);
}
function renderRecent(){
  $('#sRes').innerHTML='<div class="chips" id="recent">'+(st.recent.length?st.recent.map(r=>'<button class="pill" data-a="rq" data-v="'+esc(r)+'">🕘 '+esc(r)+'</button>').join(''):'<span class="meta">कानपुर देहात, बिजली, क्रिकेट…</span>')+'</div>';
}
async function runSearch(q){
  q=q.trim();if(!q)return;
  st.recent=[q,...st.recent.filter(x=>x!==q)].slice(0,8);S.set('recent',st.recent);
  $('#sRes').innerHTML='<div class="sk"><div class="sh" style="height:16px;flex:1"></div></div>';
  try{const r=await fetchLive(q);$('#sRes').innerHTML=r.length?r.map(i=>card(i)).join(''):'<div class="empty"><b>कुछ नहीं मिला</b>दूसरा शब्द आज़माएँ।</div>'}
  catch(e){$('#sRes').innerHTML='<div class="empty"><b>खोज नहीं हो पाई</b>इंटरनेट जाँचें।</div>'}
}

// ---------- Admin (local only) ----------
let taps=0,tapT;
function adminGate(){
  const p=prompt(st.cfg.pin?'एडमिन पिन डालें:':'पहली बार: नया पिन बनाएँ (4+ अंक):');
  if(!p)return;
  hashPin(p).then(h=>{
    if(!st.cfg.pin){if(p.length<4){toast('पिन छोटा है');return}st.cfg.pin=h;S.set('cfg',st.cfg)}
    else if(st.cfg.pin!==h){toast('गलत पिन');return}
    $('#aBlog').value=st.cfg.blog||'';$('#admin').classList.add('open');history.pushState({a:1},'');
  });
}
async function hashPin(p){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('inp:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return hash(p)}
}
function adminPost(){
  const t=$('#aTitle').value.trim();if(!t){toast('हेडलाइन लिखें');return}
  const {kick,head}=parseTitle(t);
  const o={id:'l'+Date.now(),kick,head,src:'हमारी खबर',loc:$('#aLoc').value.trim()||'उत्तरप्रदेश',img:safeUrl($('#aImg').value.trim()),link:'',date:new Date().toISOString(),full:$('#aFull').value.trim(),own:1};
  st.local.unshift(o);S.set('local',st.local);closeSheet();toast('पब्लिश हुआ');setTab('home');
}
function adminCopy(){
  const t=$('#aTitle').value.trim();if(!t){toast('हेडलाइन लिखें');return}
  const im=safeUrl($('#aImg').value.trim());
  const code='<!-- पोस्ट का टाइटल: '+t+' -->\n'+(im?'<img src="'+im+'">\n':'')+'<p>'+$('#aFull').value.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</p>';
  navigator.clipboard.writeText(code).then(()=>toast('कोड कॉपी हो गया'),()=>toast('कॉपी नहीं हो पाया'));
}

// ---------- Events (ek hi jagah, delegation) ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a],[data-tab],.cat');if(!el)return;
  if(el.dataset.tab){setTab(el.dataset.tab);return}
  if(el.classList.contains('cat')){st.cat=+el.dataset.i;renderCats();load(CATS[st.cat].q);return}
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'open':openArticle(id);break;
    case 'bm':toggleBm(id);break;
    case 'share':share(id);break;
    case 'speakc':speak(id,el);break;
    case 'speak':if(st.cur)speak(st.cur.id,el);break;
    case 'rbm':if(st.cur)toggleBm(st.cur.id);break;
    case 'rshare':if(st.cur)share(st.cur.id);break;
    case 'close':closeSheet();break;
    case 'search':openSearch();break;
    case 'theme':st.prefs.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';S.set('prefs',st.prefs);applyPrefs();break;
    case 'loc':case 'rq':openSearch();$('#q').value=v;runSearch(v);break;
    case 'retry':load(CATS[st.cat].q,true);break;
    case 'fs':st.prefs.fs=+v;S.set('prefs',st.prefs);applyPrefs();showSettings();break;
    case 'th':st.prefs.theme=v;S.set('prefs',st.prefs);applyPrefs();showSettings();break;
    case 'admin':adminGate();break;
    case 'pub':adminPost();break;
    case 'cpy':adminCopy();break;
    case 'saveblog':st.cfg.blog=$('#aBlog').value.trim();S.set('cfg',st.cfg);closeSheet();toast('सेव हुआ');setTab('home');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='open')openArticle(e.target.dataset.id)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch(e.target.value)});
$('#rBody').addEventListener('scroll',e=>{const b=e.target;$('#prog').style.width=(b.scrollTop/Math.max(1,b.scrollHeight-b.clientHeight)*100)+'%'});
window.addEventListener('popstate',closeSheet);
window.addEventListener('online',()=>{$('#off').style.display='none';load(CATS[st.cat].q,true)});
window.addEventListener('offline',()=>{$('#off').style.display='block'});
// Logo par 5 baar tap = admin
$('.logo').addEventListener('click',()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1600);if(taps>=5){taps=0;adminGate()}});

// Pull to refresh
(()=>{const f=$('#feed'),p=$('#ptr');let y0=0,d=0,on=false;
 f.addEventListener('touchstart',e=>{if(f.scrollTop===0){y0=e.touches[0].clientY;on=true}},{passive:true});
 f.addEventListener('touchmove',e=>{if(!on)return;d=e.touches[0].clientY-y0;if(d>0)p.style.height=Math.min(d/2,56)+'px';p.textContent=d>110?'↻ छोड़ें':'↓ रिफ्रेश के लिए खींचें'},{passive:true});
 f.addEventListener('touchend',()=>{if(on&&d>110&&st.tab==='home')load(CATS[st.cat].q,true);p.style.height='0';on=false;d=0});})();

function renderCats(){
  $('#cats').innerHTML=CATS.map((c,i)=>'<button class="cat" role="tab" data-i="'+i+'" aria-selected="'+(i===st.cat)+'">'+esc(c.n)+'</button>').join('');
  const a=$('.cat[aria-selected=true]');a&&a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
// Auto refresh har 5 minute (sirf home par)
setInterval(()=>{if(st.tab==='home'&&!document.hidden&&!$('.sheet.open'))load(CATS[st.cat].q,true)},3e5);

// PWA: manifest (inline) taaki "Add to Home Screen" chale
try{const m={name:'इंडियन न्यूज़',short_name:'न्यूज़',display:'standalone',start_url:location.href,background_color:'#f6f1e9',theme_color:'#c2410c'};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l)}catch(e){}

renderCats();setTab('home');
</script>
