<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>News Editor Pro | Ultimate Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Premium Hindi Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Khand:wght@500;700&family=Mukta:wght@400;700;800&family=Rajdhani:wght@500;700&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Mukta', sans-serif; background-color: #111827; color: white; touch-action: none; overscroll-behavior-y: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        canvas { max-width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .tool-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #374151; padding: 8px; border-radius: 8px; font-size: 11px; gap: 4px; min-width: 70px; border: 1px solid #4B5563; }
        .tool-btn:active { transform: scale(0.95); }
        input[type="range"] { accent-color: #ef4444; width: 100%; }
        input[type="color"] { border: none; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; }
        select { background: #374151; color: white; padding: 4px; border-radius: 4px; outline: none; border: 1px solid #4B5563; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden fixed inset-0">

    <!-- Header (Size, Clear, Export) -->
    <header class="flex-none flex justify-between items-center p-3 bg-gray-900 border-b border-gray-700 z-10 h-[60px]">
        <select id="canvasRatio" onchange="resizeCanvas()" class="text-sm">
            <option value="9:16">Reels (9:16)</option>
            <option value="1:1">Square (1:1)</option>
            <option value="4:5">Portrait (4:5)</option>
            <option value="16:9">YouTube (16:9)</option>
        </select>
        <h1 class="font-extrabold text-lg text-red-500 tracking-wider">PRO<span class="text-white">Editor</span></h1>
        <div class="flex gap-3 items-center">
            <button onclick="clearCanvas()" class="text-gray-400 hover:text-red-400"><i class="fas fa-trash"></i></button>
            <button onclick="exportHD()" class="bg-blue-600 px-4 py-1 rounded-md font-bold text-sm hover:bg-blue-500">
                <i class="fas fa-download"></i> HD
            </button>
        </div>
    </header>

    <!-- Canvas Workspace -->
    <main class="flex-1 flex justify-center items-center bg-black p-2 relative w-full h-full overflow-hidden" id="workspace">
        <canvas id="newsCanvas"></canvas>
    </main>

    <!-- Layer Settings (Bottom Sheet) -->
    <div id="bottomSheet" class="hidden absolute bottom-[85px] left-0 w-full bg-gray-800 rounded-t-2xl p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.8)] z-20 transition-transform overflow-y-auto max-h-[60vh] hide-scrollbar">
        <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
            <h3 class="font-bold text-sm text-yellow-400"><i class="fas fa-sliders-h mr-2"></i>लेयर कंट्रोल (Full Control)</h3>
            <button onclick="hideBottomSheet()" class="text-gray-400 text-xl"><i class="fas fa-times"></i></button>
        </div>
        
        <!-- Text Colors (Word-by-word support) -->
        <div class="flex items-center justify-between mb-3 bg-gray-700 p-2 rounded-lg">
            <span class="text-xs">टेक्स्ट कलर (Text Color)</span>
            <div class="flex gap-2 items-center">
                <input type="color" id="textColor" value="#ffffff" onchange="applyTextColor()">
                <button onclick="applyTextColor()" class="bg-green-600 text-xs px-2 py-1 rounded">Apply</button>
            </div>
            <p class="text-[10px] text-gray-400 w-full absolute mt-10">Tip: डबल क्लिक करके किसी एक शब्द को सेलेक्ट करें और कलर बदलें!</p>
        </div>

        <!-- Fonts -->
        <div class="flex justify-between items-center mb-3 bg-gray-700 p-2 rounded-lg mt-4">
            <span class="text-xs">फॉन्ट बदलें</span>
            <select id="fontFamily" onchange="changeFont()" class="text-xs">
                <option value="Mukta">Mukta (Standard)</option>
                <option value="Khand">Khand (Bold/News)</option>
                <option value="Yatra One">Yatra One (Stylized)</option>
                <option value="Rajdhani">Rajdhani (Tech/Modern)</option>
                <option value="Anton">Anton (Heavy)</option>
            </select>
        </div>

        <!-- Border / Outline (Stroke) -->
        <div class="mb-3 bg-gray-700 p-2 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs">बॉर्डर / आउटलाइन (Stroke)</span>
                <input type="color" id="strokeColor" value="#ff0000" onchange="updateStroke()">
            </div>
            <input type="range" id="strokeWidth" min="0" max="20" value="0" oninput="updateStroke()">
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-4 gap-2 text-xs mt-3">
            <button class="tool-btn bg-gray-900" onclick="bringFront()"><i class="fas fa-layer-group text-blue-400"></i>Front</button>
            <button class="tool-btn bg-gray-900" onclick="sendBack()"><i class="fas fa-layer-group text-blue-400 opacity-50"></i>Back</button>
            <button class="tool-btn bg-gray-900" onclick="toggleLock()"><i class="fas fa-lock text-yellow-400"></i>Lock/Unlock</button>
            <button class="tool-btn bg-gray-900" onclick="cloneObj()"><i class="fas fa-copy text-green-400"></i>Clone</button>
        </div>
    </div>

    <!-- Main Toolbar -->
    <footer class="flex-none bg-gray-900 border-t border-gray-800 p-2 z-10 w-full h-[85px]">
        <div class="flex overflow-x-auto hide-scrollbar gap-2 items-center px-1 h-full">
            
            <button class="tool-btn" onclick="document.getElementById('imageUpload').click()">
                <i class="fas fa-image text-blue-400 text-lg"></i><span>फोटो लाएं</span>
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
            </button>

            <!-- Circle Crop Button -->
            <button class="tool-btn" onclick="makeCircleCrop()">
                <i class="fas fa-circle text-pink-400 text-lg"></i><span>गोल काटें</span>
            </button>

            <button class="tool-btn" onclick="addHeadline()">
                <i class="fas fa-font text-white text-lg"></i><span>हेडलाइन</span>
            </button>

            <!-- 3D Location -->
            <button class="tool-btn" onclick="add3DLocation()">
                <i class="fas fa-map-marker-alt text-red-500 text-lg"></i><span>3D लोकेशन</span>
            </button>

            <!-- Premium Date -->
            <button class="tool-btn" onclick="addPremiumDate()">
                <i class="fas fa-calendar-alt text-yellow-400 text-lg"></i><span>तारीख (Date)</span>
            </button>

            <!-- Custom Logo -->
            <button class="tool-btn" onclick="addMyLogo()">
                <i class="fas fa-stamp text-green-400 text-lg"></i><span>मेरा लोगो</span>
            </button>
            <button class="hidden" onclick="document.getElementById('logoUpload').click()" id="uploadLogoBtn"></button>
            <input type="file" id="logoUpload" accept="image/*" class="hidden">

            <!-- Post Frame -->
            <button class="tool-btn" onclick="addPostBorder()">
                <i class="fas fa-border-style text-purple-400 text-lg"></i><span>पोस्ट बॉर्डर</span>
            </button>

        </div>
    </footer>

    <script>
        // ==========================================
        // 1. CANVAS SETUP & RATIO
        // ==========================================
        const canvas = new fabric.Canvas('newsCanvas', { preserveObjectStacking: true, backgroundColor: '#1f2937' });
        
        function resizeCanvas() {
            const workspace = document.getElementById('workspace');
            const ratioVal = document.getElementById('canvasRatio').value;
            let ratio = 9/16; // default Reels size
            if(ratioVal === '1:1') ratio = 1;
            if(ratioVal === '4:5') ratio = 4/5;
            if(ratioVal === '16:9') ratio = 16/9;

            const maxW = workspace.clientWidth - 10;
            const maxH = workspace.clientHeight - 10;
            
            let w = maxW;
            let h = w / ratio;
            if (h > maxH) { h = maxH; w = h * ratio; }
            
            canvas.setWidth(w);
            canvas.setHeight(h);
            canvas.renderAll();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        // ==========================================
        // 2. TEXT & WORD-BY-WORD COLOR SYSTEM
        // ==========================================
        function addHeadline() {
            const text = new fabric.Textbox("यहाँ अपनी ब्रेकिंग न्यूज़ लिखें", {
                left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center',
                fontFamily: 'Khand', fontSize: canvas.width * 0.08, fill: '#ffffff', fontWeight: 'bold',
                textAlign: 'center', width: canvas.width * 0.9,
                shadow: new fabric.Shadow({ color: '#000000', blur: 5, offsetX: 2, offsetY: 2 })
            });
            canvas.add(text); canvas.setActiveObject(text);
        }

        // Feature: Ek shabd ka color badalna
        function applyTextColor() {
            const obj = canvas.getActiveObject();
            const color = document.getElementById('textColor').value;
            if(!obj) return;

            // Agar user ne double click karke text select kiya hai (Word-by-word)
            if (obj.isEditing && obj.selectionStart !== obj.selectionEnd) {
                const style = { fill: color };
                obj.setSelectionStyles(style, obj.selectionStart, obj.selectionEnd);
            } else {
                // Pura text color
                obj.set('fill', color);
            }
            canvas.renderAll();
        }

        function changeFont() {
            const obj = canvas.getActiveObject();
            if(obj && obj.text) {
                obj.set('fontFamily', document.getElementById('fontFamily').value);
                canvas.renderAll();
            }
        }

        // ==========================================
        // 3. 3D LOCATION & PREMIUM DATE
        // ==========================================
        function add3DLocation() {
            const locText = new fabric.Textbox("📍 आपकी लोकेशन", {
                left: 20, top: canvas.height/2, fontFamily: 'Rajdhani', fontSize: canvas.width * 0.06,
                fill: '#ffffff', fontWeight: 'bold', stroke: '#000000', strokeWidth: 1,
                // Tagda 3D Effect
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.9)', blur: 2, offsetX: 3, offsetY: 3 })
            });
            canvas.add(locText); canvas.setActiveObject(locText);
        }

        function addPremiumDate() {
            const today = new Date().toLocaleDateString('hi-IN', { day:'numeric', month:'long', year:'numeric' });
            
            // Ribbon Back
            const bg = new fabric.Rect({ left: 0, top: 0, width: 220, height: 40, fill: '#facc15', rx: 5, ry: 5 });
            const txt = new fabric.Text(today, { left: 15, top: 7, fontSize: 20, fill: '#000000', fontWeight: 'bold', fontFamily: 'Khand' });
            const group = new fabric.Group([bg, txt], { left: canvas.width - 230, top: 20 });
            canvas.add(group); canvas.setActiveObject(group);
        }

        // ==========================================
        // 4. IMAGE CROP (CIRCLE) & BORDER SYSTEM
        // ==========================================
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    img.scaleToWidth(canvas.width * 0.8);
                    img.set({ left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center' });
                    canvas.add(img); canvas.setActiveObject(img);
                });
            };
            reader.readAsDataURL(file);
        });

        // Gol (Circle) Crop Function
        function makeCircleCrop() {
            const obj = canvas.getActiveObject();
            if(!obj || obj.type !== 'image') { alert("पहले कोई फोटो सेलेक्ट करें!"); return; }
            
            // Math to make perfect circle clip
            const radius = Math.min(obj.width, obj.height) / 2;
            const circle = new fabric.Circle({
                radius: radius, originX: 'center', originY: 'center',
                left: 0, top: 0
            });
            obj.set({ clipPath: circle });
            canvas.renderAll();
        }

        // Outline / Border for Image & Text
        function updateStroke() {
            const obj = canvas.getActiveObject();
            if(!obj) return;
            const width = parseInt(document.getElementById('strokeWidth').value);
            const color = document.getElementById('strokeColor').value;
            obj.set({ stroke: color, strokeWidth: width });
            canvas.renderAll();
        }

        // Final Post Border
        function addPostBorder() {
            const frame = new fabric.Rect({
                left: 0, top: 0, width: canvas.width, height: canvas.height,
                fill: 'transparent', stroke: '#ef4444', strokeWidth: 15, // Red Border
                selectable: true
            });
            canvas.add(frame);
        }

        // ==========================================
        // 5. LOGO SYSTEM (LOCAL STORAGE)
        // ==========================================
        function addMyLogo() {
            const savedLogo = localStorage.getItem('userCustomLogoPro');
            if (savedLogo) {
                fabric.Image.fromURL(savedLogo, (img) => {
                    img.scaleToHeight(60);
                    img.set({ left: 10, top: 10 });
                    canvas.add(img); canvas.setActiveObject(img);
                });
            } else {
                if(confirm("आपने अभी तक कोई लोगो सेट नहीं किया है। क्या आप गैलरी से लोगो अपलोड करना चाहते हैं?")) {
                    document.getElementById('uploadLogoBtn').click();
                }
            }
        }
        
        document.getElementById('logoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                localStorage.setItem('userCustomLogoPro', f.target.result);
                alert("आपका लोगो सेव हो गया है! अब 'मेरा लोगो' बटन दबाएं।");
                addMyLogo();
            };
            reader.readAsDataURL(file);
        });

        // ==========================================
        // 6. BOTTOM SHEET CONTROLS & MANUAL LOCK
        // ==========================================
        canvas.on('selection:created', showSheet);
        canvas.on('selection:updated', showSheet);
        canvas.on('selection:cleared', hideBottomSheet);

        function showSheet() {
            const obj = canvas.getActiveObject();
            if(obj) {
                document.getElementById('bottomSheet').classList.remove('hidden');
                document.getElementById('strokeWidth').value = obj.strokeWidth || 0;
            }
        }
        function hideBottomSheet() { document.getElementById('bottomSheet').classList.add('hidden'); }
        
        function bringFront() { const obj = canvas.getActiveObject(); if(obj) canvas.bringToFront(obj); }
        function sendBack() { const obj = canvas.getActiveObject(); if(obj) canvas.sendToBack(obj); }
        function cloneObj() {
            const obj = canvas.getActiveObject();
            if(obj) {
                obj.clone((cloned) => {
                    cloned.set({ left: obj.left + 20, top: obj.top + 20 });
                    canvas.add(cloned); canvas.setActiveObject(cloned);
                });
            }
        }
        
        // Manual Lock System (No Auto Lock)
        function toggleLock() {
            const obj = canvas.getActiveObject();
            if(obj) {
                const locked = obj.lockMovementX;
                obj.set({ 
                    lockMovementX: !locked, lockMovementY: !locked, 
                    lockRotation: !locked, lockScalingX: !locked, lockScalingY: !locked,
                    hasControls: locked // lock hone par border controls chhip jayenge
                });
                canvas.discardActiveObject(); canvas.renderAll();
                alert(locked ? "अनलॉक हो गया। अब आप इसे खिसका सकते हैं।" : "लॉक हो गया! (अनलॉक करने के लिए दोबारा सेलेक्ट करके बटन दबाएं)");
            }
        }

        function clearCanvas() {
            if(confirm("पूरा डिज़ाइन डिलीट हो जाएगा!")) {
                canvas.clear(); canvas.setBackgroundColor('#1f2937', canvas.renderAll.bind(canvas));
            }
        }

        function exportHD() {
            canvas.discardActiveObject(); canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'jpeg', quality: 1, multiplier: 2 }); // HD 1080p Export
            const link = document.createElement('a');
            link.download = `News_Pro_${Date.now()}.jpg`;
            link.href = dataURL; link.click();
        }
    </script>
</body>
</html>
