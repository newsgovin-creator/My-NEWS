<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PNS News Editor Pro | Fully Unlocked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Mukta', sans-serif; touch-action: none; background-color: #111827; color: white; overscroll-behavior-y: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        canvas { max-width: 100%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .tool-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #374151; padding: 10px; border-radius: 10px; font-size: 12px; gap: 5px; min-width: 75px; transition: 0.2s; border: 1px solid #4B5563; }
        .tool-btn:active { background: #4B5563; transform: scale(0.95); }
        input[type="range"] { accent-color: #ef4444; }
        select { background-color: #374151; color: white; border: 1px solid #4B5563; padding: 4px 8px; border-radius: 6px; font-size: 12px; outline: none; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden fixed inset-0">

    <!-- Top Header with Canvas Size Selector -->
    <header class="flex-none flex justify-between items-center p-3 bg-gray-900 border-b border-gray-700 z-10 h-[60px]">
        <div class="flex gap-2 items-center">
            <select id="ratioSelect" onchange="updateCanvasRatio()">
                <option value="1:1">Square (1:1)</option>
                <option value="4:5">Portrait (4:5)</option>
                <option value="16:9">TV/YT (16:9)</option>
            </select>
        </div>
        <h1 class="font-extrabold text-lg text-red-500 tracking-wide">PNS<span class="text-white">News</span></h1>
        <div class="flex gap-3 items-center">
            <button onclick="clearCanvas()" class="text-red-400 hover:text-red-300 text-lg"><i class="fas fa-trash"></i></button>
            <button id="exportBtn" class="bg-red-600 px-4 py-1.5 rounded-md font-bold text-sm hover:bg-red-500">
                <i class="fas fa-download mr-1"></i> HD
            </button>
        </div>
    </header>

    <!-- Canvas Workspace -->
    <main class="flex-1 flex justify-center items-center bg-black p-2 relative w-full h-full overflow-hidden" id="workspace">
        <canvas id="newsCanvas"></canvas>
    </main>

    <!-- Bottom Settings Sheet (For Selected Object) -->
    <div id="bottomSheet" class="hidden absolute bottom-[85px] left-0 w-full bg-gray-800 rounded-t-2xl p-4 shadow-[0_-5px_20px_rgba(0,0,0,0.8)] z-20 transition-transform">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-sm text-gray-300">लेयर सेटिंग्स</h3>
            <button onclick="hideBottomSheet()" class="text-gray-400 text-xl"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="mb-4 flex flex-col gap-3 text-sm">
            <div class="flex justify-between items-center">
                <span>Opacity</span>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="1" class="w-2/3">
            </div>
        </div>

        <div class="grid grid-cols-5 gap-2 text-xs">
            <button class="tool-btn bg-gray-700" onclick="bringFront()"><i class="fas fa-arrow-up text-blue-400"></i>Front</button>
            <button class="tool-btn bg-gray-700" onclick="sendBack()"><i class="fas fa-arrow-down text-blue-400"></i>Back</button>
            <button class="tool-btn bg-gray-700" onclick="cloneObj()"><i class="fas fa-copy text-green-400"></i>Clone</button>
            <button class="tool-btn bg-gray-700" onclick="toggleLock()"><i class="fas fa-lock text-yellow-400"></i>Lock</button>
            <button class="tool-btn bg-gray-700" onclick="deleteObj()"><i class="fas fa-trash text-red-400"></i>Delete</button>
        </div>
    </div>

    <!-- Bottom Scroll Menu -->
    <footer class="flex-none bg-gray-900 border-t border-gray-800 p-2 z-10 w-full h-[85px]">
        <div class="flex overflow-x-auto hide-scrollbar gap-2 items-center px-1 h-full">
            <button class="tool-btn" onclick="loadStandardTemplate()">
                <i class="fas fa-tv text-red-500 text-lg"></i><span>फुल स्क्रीन</span>
            </button>
            <button class="tool-btn" onclick="loadSplitTemplate()">
                <i class="fas fa-columns text-blue-400 text-lg"></i><span>स्प्लिट स्क्रीन</span>
            </button>
            <button class="tool-btn" onclick="document.getElementById('imageUpload').click()">
                <i class="fas fa-image text-green-400 text-lg"></i><span>फोटो जोड़ें</span>
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
            </button>
            <!-- Logo Upload System -->
            <button class="tool-btn" onclick="document.getElementById('logoUpload').click()">
                <i class="fas fa-shield-cat text-yellow-400 text-lg"></i><span>लोगो सेट करें</span>
                <input type="file" id="logoUpload" accept="image/*" class="hidden">
            </button>
            <button class="tool-btn" onclick="addTextLayer()">
                <i class="fas fa-font text-white text-lg"></i><span>टेक्स्ट</span>
            </button>
            <button class="tool-btn" onclick="addLiveLocation()">
                <i class="fas fa-map-marker-alt text-pink-500 text-lg"></i><span>लोकेशन</span>
            </button>
        </div>
    </footer>

    <script>
        // ==========================================
        // 1. CANVAS SETUP & DYNAMIC RESIZING
        // ==========================================
        const canvas = new fabric.Canvas('newsCanvas', { preserveObjectStacking: true, backgroundColor: '#111827' });
        let currentRatio = 1; // Default 1:1

        function updateCanvasRatio() {
            const val = document.getElementById('ratioSelect').value;
            if (val === '1:1') currentRatio = 1;
            if (val === '4:5') currentRatio = 4/5;
            if (val === '16:9') currentRatio = 16/9;
            resizeCanvas();
        }

        function resizeCanvas() {
            const workspace = document.getElementById('workspace');
            const maxWidth = workspace.clientWidth - 10;
            const maxHeight = workspace.clientHeight - 10;
            
            let width = maxWidth;
            let height = width / currentRatio;

            if (height > maxHeight) {
                height = maxHeight;
                width = height * currentRatio;
            }
            
            canvas.setWidth(width);
            canvas.setHeight(height);
            canvas.renderAll();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 2. LOGO UPLOAD & LOCAL STORAGE SYSTEM
        // ==========================================
        document.getElementById('logoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                const dataUrl = f.target.result;
                localStorage.setItem('userCustomLogo', dataUrl); // Save to browser memory
                alert("लोगो सेव हो गया है! अब जब भी आप टेम्पलेट लोड करेंगे, यही लोगो आएगा।");
            };
            reader.readAsDataURL(file);
        });

        // ==========================================
        // 3. LAYER CONTROLS (Manual Lock/Unlock)
        // ==========================================
        canvas.on('selection:created', showBottomSheet);
        canvas.on('selection:updated', showBottomSheet);
        canvas.on('selection:cleared', hideBottomSheet);

        function showBottomSheet() {
            const obj = canvas.getActiveObject();
            if(obj) {
                document.getElementById('bottomSheet').classList.remove('hidden');
                document.getElementById('opacitySlider').value = obj.opacity || 1;
            }
        }
        function hideBottomSheet() { document.getElementById('bottomSheet').classList.add('hidden'); }
        
        document.getElementById('opacitySlider').addEventListener('input', (e) => {
            const obj = canvas.getActiveObject();
            if(obj) { obj.set('opacity', parseFloat(e.target.value)); canvas.renderAll(); }
        });

        function bringFront() { const obj = canvas.getActiveObject(); if(obj) canvas.bringToFront(obj); }
        function sendBack() { const obj = canvas.getActiveObject(); if(obj) canvas.sendToBack(obj); }
        function deleteObj() { const obj = canvas.getActiveObject(); if(obj) { canvas.remove(obj); hideBottomSheet(); } }
        function cloneObj() {
            const obj = canvas.getActiveObject();
            if(obj) {
                obj.clone((cloned) => {
                    cloned.set({ left: obj.left + 20, top: obj.top + 20, evented: true });
                    canvas.add(cloned);
                    canvas.setActiveObject(cloned);
                });
            }
        }
        
        // Manual Lock/Unlock Tool
        function toggleLock() {
            const obj = canvas.getActiveObject();
            if(obj) {
                const isLocked = obj.lockMovementX;
                obj.set({ 
                    lockMovementX: !isLocked, lockMovementY: !isLocked, 
                    lockRotation: !isLocked, lockScalingX: !isLocked, 
                    lockScalingY: !isLocked, selectable: true 
                });
                alert(isLocked ? "Layer Unlocked (अनलॉक हो गई)" : "Layer Locked (लॉक हो गई)");
                canvas.renderAll();
            }
        }

        function clearCanvas() {
            if(confirm("क्या आप पूरा कैनवास डिलीट करना चाहते हैं?")) {
                canvas.clear();
                canvas.setBackgroundColor('#1f2937', canvas.renderAll.bind(canvas));
            }
        }

        // ==========================================
        // 4. ADD IMAGES & TEXT
        // ==========================================
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    img.scaleToWidth(canvas.width);
                    img.set({ left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center' });
                    canvas.add(img);
                    canvas.sendToBack(img);
                });
            };
            reader.readAsDataURL(file);
        });

        function addTextLayer(textStr = "यहाँ अपनी खबर लिखें") {
            const text = new fabric.Textbox(textStr, {
                left: canvas.width / 2, top: canvas.height / 2, originX: 'center', originY: 'center',
                fontFamily: 'Mukta', fontSize: canvas.width * 0.06, fill: '#ffffff', fontWeight: 'bold', textAlign: 'center', width: canvas.width * 0.9
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        }

        async function addLiveLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const text = new fabric.Textbox(`📍 ${data.city || 'शहर'}, यूपी`, {
                    left: 20, top: canvas.height * 0.65, fontSize: canvas.width * 0.04, fill: '#ffffff', backgroundColor: '#000000', fontWeight: 'bold', fontFamily: 'Mukta'
                });
                canvas.add(text);
            } catch(e) { addTextLayer("📍 कानपुर देहात, यूपी"); }
        }

        // ==========================================
        // 5. UNLOCKED TEMPLATES & AUTO DATE
        // ==========================================
        function getAutoDate() {
            const today = new Date();
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return today.toLocaleDateString('hi-IN', options);
        }

        function addBrandingElements() {
            // Load Custom Logo from LocalStorage (if exists)
            const savedLogo = localStorage.getItem('userCustomLogo');
            if (savedLogo) {
                fabric.Image.fromURL(savedLogo, (img) => {
                    img.scaleToHeight(50);
                    img.set({ left: 10, top: 10, selectable: true });
                    canvas.add(img);
                });
            } else {
                // Default Text Logo if no image uploaded
                const logoBg = new fabric.Rect({ left: 10, top: 10, width: 120, height: 50, fill: '#ffffff', rx: 5, ry: 5, selectable: true });
                const logoPNS = new fabric.Text("PNS", { left: 20, top: 15, fontSize: 24, fill: '#cc0000', fontWeight: 'bold', fontFamily: 'Arial', selectable: true });
                const logoBharat = new fabric.Text("भारत न्यूज़", { left: 20, top: 40, fontSize: 14, fill: '#000000', fontWeight: 'bold', fontFamily: 'Mukta', selectable: true });
                const logoGroup = new fabric.Group([logoBg, logoPNS, logoBharat], { left: 10, top: 10, selectable: true });
                canvas.add(logoGroup);
            }
            
            // Auto Date & Live Button (Unlocked)
            const autoDateString = getAutoDate();
            const dateBg = new fabric.Rect({ left: 0, top: 0, width: 150, height: 30, fill: '#facc15' });
            const dateText = new fabric.Text(autoDateString, { left: 10, top: 5, fontSize: 16, fill: '#000000', fontWeight: 'bold', fontFamily: 'Mukta' });
            const dateGroup = new fabric.Group([dateBg, dateText], { left: canvas.width - 240, top: 10, selectable: true });
            
            const liveBg = new fabric.Rect({ left: 0, top: 0, width: 70, height: 30, fill: '#cc0000' });
            const liveText = new fabric.Text("LIVE", { left: 15, top: 5, fontSize: 16, fill: '#ffffff', fontWeight: 'bold', fontFamily: 'Arial' });
            const liveGroup = new fabric.Group([liveBg, liveText], { left: canvas.width - 80, top: 10, selectable: true }); // User can select and delete this now

            // Bottom Red & Black Banners (Unlocked)
            const redBanner = new fabric.Rect({ left: 0, top: canvas.height * 0.72, width: canvas.width, height: canvas.height * 0.18, fill: '#b91c1c', selectable: true });
            const blackBanner = new fabric.Rect({ left: 0, top: canvas.height * 0.90, width: canvas.width, height: canvas.height * 0.05, fill: '#000000', selectable: true });
            const footerBanner = new fabric.Rect({ left: 0, top: canvas.height * 0.95, width: canvas.width, height: canvas.height * 0.05, fill: '#ffffff', selectable: true });

            // Footer Texts (Unlocked)
            const footerSocial = new fabric.Textbox("@YourNewsHandle", { left: 10, top: canvas.height * 0.96, fontSize: canvas.width * 0.03, fill: '#000000', fontFamily: 'Arial', selectable: true, width: 200 });
            const footerVerified = new fabric.Textbox("Verified by पवन कुमार ✅", { left: canvas.width - 160, top: canvas.height * 0.96, fontSize: canvas.width * 0.03, fill: '#000000', fontFamily: 'Mukta', selectable: true, width: 150 });

            // Headlines (Unlocked)
            const mainHeadline = new fabric.Textbox("यहाँ अपनी मुख्य ब्रेकिंग न्यूज़ लिखें", {
                left: canvas.width/2, top: canvas.height * 0.81, originX: 'center', originY: 'center', width: canvas.width * 0.95,
                fontSize: canvas.width * 0.065, fill: '#ffffff', fontWeight: 'bold', fontFamily: 'Mukta', textAlign: 'center',
                shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 2, offsetX: 1, offsetY: 1 }), selectable: true
            });

            const subHeadline = new fabric.Textbox("विस्तार से जानकारी यहाँ लिखें", {
                left: canvas.width/2, top: canvas.height * 0.925, originX: 'center', originY: 'center', width: canvas.width * 0.95,
                fontSize: canvas.width * 0.035, fill: '#ffffff', fontWeight: 'bold', fontFamily: 'Mukta', textAlign: 'center', selectable: true
            });

            canvas.add(redBanner, blackBanner, footerBanner, dateGroup, liveGroup, footerSocial, footerVerified, mainHeadline, subHeadline);
        }

        function loadStandardTemplate() {
            canvas.clear();
            canvas.setBackgroundColor('#1f2937', canvas.renderAll.bind(canvas));
            const bgHint = new fabric.Text("फोटो अपलोड करने के लिए\n'फोटो जोड़ें' पर क्लिक करें", { left: canvas.width/2, top: canvas.height/2.5, originX: 'center', originY: 'center', fontSize: 24, fill: '#4B5563', textAlign: 'center', selectable: true });
            canvas.add(bgHint);
            addBrandingElements();
        }

        function loadSplitTemplate() {
            canvas.clear();
            canvas.setBackgroundColor('#1f2937', canvas.renderAll.bind(canvas));
            const divider = new fabric.Line([canvas.width/2, 0, canvas.width/2, canvas.height * 0.72], { stroke: '#ffffff', strokeWidth: 4, selectable: true });
            canvas.add(divider);
            addBrandingElements();
        }

        // ==========================================
        // 6. HD EXPORT
        // ==========================================
        document.getElementById('exportBtn').addEventListener('click', () => {
            canvas.discardActiveObject(); canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'jpeg', quality: 1, multiplier: 2 });
            const link = document.createElement('a');
            link.download = `News_Export_${Date.now()}.jpg`;
            link.href = dataURL;
            link.click();
        });

        // Initialize empty workspace (No template auto-loaded so user can choose ratio first)
        window.onload = () => {
            canvas.setBackgroundColor('#1f2937', canvas.renderAll.bind(canvas));
        };
    </script>
</body>
</html>
